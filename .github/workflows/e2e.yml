name: E2E regression

on:
  pull_request:
    branches: [ master ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # No secrets and no -Assistant: the real assistant check calls a paid service
      - name: Run the regression suite
        shell: pwsh
        run: ./e2e/run-e2e.ps1

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/TestResults/*.trx
          if-no-files-found: warn
