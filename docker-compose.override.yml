services:
  ms.rabbitmq.bus:
    container_name: ms.rabbitmq.bus
    restart: always
    ports:
     - "5672:5672"
     - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 12

  ms.mongo.attendances.db:
    container_name: ms.mongo.attendances.db
    restart: always
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27019:27017"

  ms.cassandra.db:
    container_name: ms.cassandra.db
    restart: always
    volumes:
      - cassandra_data:/var/lib/cassandra
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh localhost 9042 -e \"SELECT now() FROM system.local\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
       
  ms.sql.employees.db:
    container_name: ms.sql.employees.db
    restart: always
    volumes:
      - sqlserver_data:/var/opt/mssql/data
    ports:
      - "1434:1433"
    environment:
      SA_PASSWORD: ".123Pass456."
      ACCEPT_EULA: "Y"

  ms.employees.api:
    container_name: ms.employees.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=80
      - "ConnectionStrings:EmployeeDB=Data Source=ms.sql.employees.db; Initial Catalog=EmployeesAttendance; User ID=sa; Password=.123Pass456.; MultipleActiveResultSets=True;"
      - "Communication:EventBus:HostName=ms.rabbitmq.bus"
      - "Communication:External:AttendanceApiUrl=http://ms.attendances.api:80"
      - "Communication:External:UsersApiUrl=http://ms.users.api:80"
      - "Authentication:JWT:Authority=http://ms.users.api:80"
    ports:
      - "9010:80"
    depends_on:
      ms.sql.employees.db:
        condition: service_started
      ms.rabbitmq.bus:
        condition: service_healthy
      ms.attendances.api:
        condition: service_started
      ms.users.api:
        condition: service_started

  ms.users.api:
    container_name: ms.users.api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=80
      - "DatabaseSettings:Hostname=ms.cassandra.db"
      # The signing key is generated here on first start and kept in the users_keys volume. Only ms.users can read it
      - "Authentication:JWT:PrivateKeyPath=/keys/jwt-signing.pem"
    volumes:
      - users_keys:/keys
    ports:
      - "9009:80"
    depends_on:
      ms.cassandra.db:
        condition: service_healthy

  ms.attendances.api:
    container_name: ms.attendances.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=80
      - "ConnectionStrings:MongoDB=mongodb://ms.mongo.attendances.db:27017"
      - "ConnectionStrings:AttendanceDB=DbHistoricalAttendance"
      - "ConnectionStrings:AttendanceCollection=Attendances"
      - "Communication:EventBus:HostName=ms.rabbitmq.bus"
      - "Authentication:JWT:Authority=http://ms.users.api:80"
    ports:
      - "9020:80"
    depends_on:
      ms.mongo.attendances.db:
        condition: service_started
      ms.rabbitmq.bus:
        condition: service_healthy

  ms.assistant.api:
    container_name: ms.assistant.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=80
      - "Communication:External:AttendanceApiUrl=http://ms.attendances.api:80"
      - "Communication:External:EmployeeApiUrl=http://ms.employees.api:80"
      - "Anthropic:ApiKey=${ANTHROPIC_API_KEY}"
      - "Authentication:JWT:Authority=http://ms.users.api:80"
    ports:
      - "9030:80"
    depends_on:
      ms.attendances.api:
        condition: service_started
      ms.employees.api:
        condition: service_started

  ms.gateway.api:
    container_name: ms.gateway.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=80
      - "Authentication:JWT:Authority=http://ms.users.api:80"
    ports:
      - "9000:80"
    depends_on:
      ms.users.api:
        condition: service_started
      ms.employees.api:
        condition: service_started
      ms.attendances.api:
        condition: service_started
      ms.assistant.api:
        condition: service_started

volumes:
  cassandra_data:
  users_keys:
  mongodb_data:
  sqlserver_data:
